# markdownlint-cli2 configuration.
#
# HETFS Markdown quality baseline.
# All rules are enabled by default, with explicit exceptions
# and project-specific rule parameters.
#
# Reference:
# https://github.com/DavidAnson/markdownlint
# https://github.com/DavidAnson/markdownlint-cli2

config:
  default: true

  # === Headings ===============================================================

  heading-increment: true
  heading-style: true

  blanks-around-headings:
    lines_above: 1
    lines_below: 1

  heading-start-left: true

  no-missing-space-atx: true
  no-multiple-space-atx: true
  no-missing-space-closed-atx: true
  no-multiple-space-closed-atx: true

  no-duplicate-heading:
    siblings_only: false

  single-title: true
  no-trailing-punctuation:
    punctuation: ".,;:!?。，；：！？"

  first-line-heading: false
  required-headings: false

  # === Lists ==================================================================

  ul-style:
    style: consistent

  list-indent: true

  ul-indent:
    indent: 2

  ul-start-left: false

  ol-prefix:
    style: one

  list-marker-space:
    ul_single: 1
    ol_single: 1
    ul_multi: 1
    ol_multi: 1

  blanks-around-lists: true

  # === Whitespace =============================================================

  no-trailing-spaces:
    br_spaces: 2
    list_item_empty_lines: false
    strict: false

  no-hard-tabs:
    code_blocks: true

  no-multiple-blanks:
    maximum: 1

  # === Line length ============================================================

  # Disabled intentionally. Long URLs, documentation references,
  # and technical examples should not trigger line-length diagnostics.
  line-length: false

  # === Blockquotes ============================================================

  no-multiple-space-blockquote: true
  no-blanks-blockquote: true

  # === Code blocks ============================================================

  commands-show-output: true

  fenced-code-language: true

  blanks-around-fences: true

  code-block-style:
    style: fenced

  code-fence-style:
    style: backtick

  no-space-in-code: true

  # === Inline formatting ======================================================

  no-emphasis-as-heading: false
  no-space-in-emphasis: true
  emphasis-style:
    style: asterisk

  strong-style:
    style: asterisk

  # === Links and images =======================================================

  no-reversed-links: true
  no-bare-urls: false
  no-empty-links: true

  link-fragments: true
  reference-links-images: true
  link-image-reference-definitions: true
  link-image-style: true
  descriptive-link-text: true
  no-alt-text: true

  # === HTML ===================================================================

  # Inline HTML is permitted by this baseline.
  no-inline-html: false

  # === Horizontal rules =======================================================

  hr-style:
    style: "---"

  # === Proper names ===========================================================

  proper-names:
    names: []
    code_blocks: false

  # === Tables =================================================================

  table-pipe-style: true
  table-column-count: true
  blanks-around-tables: true

  table-column-style:
    style: compact

# === markdownlint-cli2 options ================================================

noBanner: true
noProgress: true
showFound: false

# Structured JSON output consumed by lua/langs/markdown/lint.lua.
outputFormatters:
  - - ./scripts/markdownlint/formatter.mjs

